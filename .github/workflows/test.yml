name: Forge dashboard tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-and-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py simulator.py adapter.py auth.py workspace.py tools/build_preview.py training.py train_worker.py tools/download_models.py huggingface.py model_downloads.py architectures.py
      - run: node --check static/app.js
      - run: node --check static/i18n.js
      - run: node --check static/workspace.js
      - run: node --check static/training.js
      - run: node --check static/huggingface.js
      - run: node --check tools/verify_browser.js
      - run: node tests/test_frontend.js
      - run: node tests/test_i18n.js
  native-architectures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1 sentencepiece==0.2.1
      - run: python -m unittest discover -s tests -p test_architectures.py -v
